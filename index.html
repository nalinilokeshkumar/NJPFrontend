<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Jaya Job Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #authorPopup {
            position: fixed;
            bottom: 70px;
            right: 20px;
            background: #212529;
            color: white;
            padding: 15px;
            border-radius: 12px;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 999;
            max-width: 250px;
            animation: fadeIn 0.5s ease;
        }

        #authorPopup button {
            margin-top: 10px;
            background: #0dcaf0;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        #authorPopup button:hover {
            background: #0bbcd6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            background: #f4f6f9;
        }

        .login-box {
            width: 400px;
            margin: 100px auto;
        }

        .card {
            padding: 20px;
            border-radius: 10px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #212529;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Jaya Job Portal</span>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="login-box">
        <div class="card shadow">
            <h4 class="text-center mb-3">Login</h4>

            <div class="mb-3">
                <label>Username / Email</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username or email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password">
            </div>

            <button class="btn btn-primary w-100" onclick="login()">Login</button>

            <p class="text-center mt-3">
                Not registered?
                <a href="register.html">Register here</a>
            </p>

            <p id="msg" class="text-danger text-center"></p>
        </div>
    </div>


    <footer>
        © Copyright by
        <span>
            JAYABALAJEE S K
        </span>
    </footer>
    <div id="authorPopup">
        <p>Hi you wanna know who is Jayabalajee S K ?</p>
        <button onclick="openPortfolio()">Click Here</button>
    </div>

    <!-- JS -->
    <script>
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("http://127.0.0.1:8000/api/accounts/login/",
                {
                    method: "POST",
                    headers:
                    {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({ username, password })
                });

            const data = await response.json();

            if (data.msg === "Login Success") {

                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("refresh_token", data.refresh_token);

                // OPTIONAL (user info)
                localStorage.setItem("user_id", data.user_id);
                localStorage.setItem("username", data.username); //jwt
                alert("Login Successful");
                window.location.href = "dashboard.html";
            }
            else {
                document.getElementById("msg").innerText = data.msg;
            }
        }


        // ✅ Show after 5 seconds (every page load)
        setTimeout(() => {
            document.getElementById("authorPopup").style.display = "block";
        }, 5000);

        // ✅ Open portfolio
        function openPortfolio() {
            window.open("https://jayabalajeesk-portfolio-flax-xi.vercel.app/", "_blank");
        }

    </script>

</body>

</html>

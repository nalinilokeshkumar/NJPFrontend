        // ✅ Get logged user (UPDATED)
        async function getUser() {
            const res = await fetch(`${BASE_URL}/api/accounts/check-session/`, {
                credentials: "include"
            });

            const data = await res.json();

            if (!data.logged_in) {
                window.location.href = "https://njp-nalinijobportal.vercel.app/index.html";
            } else {
                document.getElementById("username").innerText = "Welcome " + data.username;
            }
        }

        // ✅ Load jobs
        async function loadJobs() {
            const res = await fetch(`${BASE_URL}/api/jobs/all/`);
            const jobs = await res.json();

            const today = new Date();

            // ✅ Sort jobs
            jobs.sort((a, b) => {
                const dateA = new Date(a.deadline);
                const dateB = new Date(b.deadline);

                const isAPast = dateA < today;
                const isBPast = dateB < today;

                // If one is past and other is not → push past to bottom
                if (isAPast && !isBPast) return 1;
                if (!isAPast && isBPast) return -1;

                // If both are future OR both are past → sort by closest date
                return dateA - dateB;
            });

            renderJobs(jobs);
        }
        function renderJobs(jobs) {
            let html = "";

            if (jobs.length === 0) {
                html = `<h4 class="text-center text-danger">No jobs found</h4>`;
            }

            jobs.forEach(job => {
                html += `
            <div class="col-md-4 mb-4">
                <div class="card shadow" onclick="viewJob(${job.id})">
                    <img src="${job.photo ? BASE_URL + job.photo : 'https://via.placeholder.com/300'}">

                    <div class="card-body">
                        <h5>${job.title}</h5>
                        <p>${job.desc.substring(0, 80)}...</p>

                        <p><b>Deadline:</b> ${job.deadline}</p>
                        <p><b>Posted By:</b> ${job.username}</p>
                    </div>
                </div>
            </div>
        `;
            });

            document.getElementById("jobList").innerHTML = html;
        }
        // ✅ View job
        function viewJob(id) {
            window.location.href = `https://njp-nalinijobportal.vercel.app/job-detail.html?id=${id}`;
        }

        // ✅ Logout
        async function logout() {
            await fetch(`${BASE_URL}/api/accounts/logout/`, {
                method: "POST",
                credentials: "include"
            });

            localStorage.removeItem("visitedDashboard");

            alert("Logged out");
            window.location.href = "https://njp-nalinijobportal.vercel.app/index.html";
        }

        // ✅ Add Job
        function goToAddJob() {
            window.location.href = "https://njp-nalinijobportal.vercel.app/add-job.html";
        }

        // INIT
       // handleSplash();
        getUser();
        loadJobs();



        // ✅ Show after 5 seconds (every page load)
        setTimeout(() => {
            document.getElementById("authorPopup").style.display = "block";
        }, 5000);

        // ✅ Open portfolio
        function openPortfolio() {
            window.open("https://jayabalajeesk-portfolio-flax-xi.vercel.app/", "_blank");
        }



        async function searchJobs() {
            const query = document.getElementById("searchInput").value;

            if (!query) {
                loadJobs(); // if empty → show all jobs
                return;
            }

            const res = await fetch(`${BASE_URL}/api/jobs/search/?q=${query}`);
            const jobs = await res.json();

            renderJobs(jobs);
        }
